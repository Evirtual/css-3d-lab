name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: that moves to Ubuntu 26 from 2026-10-19, and the Chromium that
    # films the share images installs its system libraries per Ubuntu release. Move up on purpose.
    runs-on: ubuntu-24.04
    steps:
      # The whole history, not the usual one commit: the sign-off below is dated by asking git when
      # its line last changed, and a shallow checkout has no history to ask.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Before anything is built: refuse unless the person publishing said to push THIS commit.
      # The pre-push hook (scripts/pre-push.mjs) says no on the machine that pushes, and git lets
      # that machine skip it. This is the same rule where it cannot be skipped. A commit without a
      # sign-off stays on the branch and the live site stays as it was.
      - name: The sign-off is for this commit
        run: node scripts/check-signoff.mjs
      - run: npm ci
      # The render service (the Cloudflare Worker in worker/) is baked into the bundle at build
      # time; without it the Video / Image / Print dialog says the export service is not configured.
      - run: npm run build
        env:
          VITE_CAPTURE_URL: ${{ vars.VITE_CAPTURE_URL }}
      # Screenshot every demo from the built site into dist/media: the social preview images.
      # A failure here fails the deploy, so pages never point at an image that does not exist.
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      # The site asks for Inter; without it the runner falls back to a much wider font, and the
      # preview headlines no longer fit their column.
      - name: Fonts for the preview images
        run: sudo apt-get install -y fonts-inter
      - name: Social preview images
        run: npm run media
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
