name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: that moves to Ubuntu 26 from 2026-10-19, and the Chromium that
    # films the share images installs its system libraries per Ubuntu release. Move up on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Screenshot every demo from the built site into dist/media: the social preview images.
      # A failure here fails the deploy, so pages never point at an image that does not exist.
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      # The site asks for Inter; without it the runner falls back to a much wider font, and the
      # preview headlines no longer fit their column.
      - name: Fonts for the preview images
        run: sudo apt-get install -y fonts-inter
      - name: Social preview images
        run: npm run media
      # The "Download video" buttons link to files of the repo's "reels" release: check every
      # listed one is there at the size recorded in src/reels.json (a mismatch fails the deploy).
      - name: Demo videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-reels.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
